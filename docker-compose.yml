version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Setup Service (One-off)
  #    Downloads the AI model (about 730 MB) to a shared volume. Skipped when
  #    the file is already there.
  # ---------------------------------------------------------------------------
  setup_model:
    image: alpine:3.20
    container_name: alphainsights-setup
    volumes:
      - ./backend/setup_model.sh:/setup.sh:ro
      - ollama_downloads:/models
    command: >
      sh -c "apk add --no-cache curl bash && bash /setup.sh"
    networks:
      - alphainsights-net

  # ---------------------------------------------------------------------------
  # 2. AI Inference Engine (llama.cpp)
  #    llama-server running the GGUF that setup_model downloaded. Configured
  #    through LLAMA_ARG_* variables (each mirrors a llama-server flag). For
  #    runs without the model, use the mock instead:
  #      docker compose -f docker-compose.yml -f docker-compose.mock-llm.yml up
  # ---------------------------------------------------------------------------
  text-gen-cpp:
    # Pinned build; LFM2.5 needs a llama.cpp recent enough to know its architecture.
    image: ghcr.io/ggml-org/llama.cpp:server-b11243
    restart: unless-stopped
    container_name: alphainsights-text-gen-cpp
    volumes:
      - ollama_downloads:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/LFM2.5-1.2B-Thinking-Q4_K_M.gguf
      - LLAMA_ARG_ALIAS=lfm-thinking
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      # Total context, shared by the server's parallel slots.
      - LLAMA_ARG_CTX_SIZE=32768
      # Cap the prompt cache (MiB of host RAM); llama-server's default is 8 GiB.
      - LLAMA_ARG_CACHE_RAM=256
    # Reachable from this machine only; the app talks to it over the compose network.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - alphainsights-net
    depends_on:
      setup_model:
        condition: service_completed_successfully
    healthcheck:
      # /health answers 503 until the model is loaded.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ---------------------------------------------------------------------------
  # 3. Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: alphainsights-backend
    # Runs the code built into the image (no source mount, no auto-reload):
    # after changing backend code, rebuild with
    # docker compose up -d --build backend worker (run.sh does this).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # This machine only; other machines reach the API through nginx (/api/).
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/polymarket
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LLAMA_CPP_HOST=http://text-gen-cpp:8080
      # Compose runs no Ollama; empty keeps every model on llama.cpp.
      - OLLAMA_HOST=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphainsights-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 4. Frontend UI (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: alphainsights-frontend
    # This machine only; other machines reach the UI through nginx.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - alphainsights-net

  # ---------------------------------------------------------------------------
  # 5. Background Worker (Celery)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: alphainsights-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/polymarket
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LLAMA_CPP_HOST=http://text-gen-cpp:8080
      # Compose runs no Ollama; empty keeps every model on llama.cpp.
      - OLLAMA_HOST=
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - alphainsights-net

  # ---------------------------------------------------------------------------
  # 6. Infrastructure (DB, Redis, Nginx)
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    container_name: alphainsights-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=polymarket
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published on the host: the app reaches it as db:5432 on the compose
    # network. For a shell: docker compose exec db psql -U postgres polymarket
    networks:
      - alphainsights-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: alphainsights-redis
    # Not published on the host: the app reaches it as redis:6379 on the
    # compose network. For a shell: docker compose exec redis redis-cli
    volumes:
      - redis_data:/data
    networks:
      - alphainsights-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: alphainsights-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - alphainsights-net

  # ---------------------------------------------------------------------------
  # 7. Test Runner (Playwright)
  # ---------------------------------------------------------------------------
  test-runner:
    build:
      context: ./local_tests
      dockerfile: Dockerfile
    container_name: alphainsights-test-runner
    volumes:
      - ./local_tests:/app
    environment:
      - BASE_URL=http://frontend:3000
    depends_on:
      - frontend
      - backend
      - db
    networks:
      - alphainsights-net
    command: pytest -v --html=report.html --self-contained-html
    profiles: ["test"] # Only start when explicitly requested


networks:
  alphainsights-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_downloads:
  huggingface_cache:
